<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Windows Classic Games</title>
  <link rel="stylesheet" href="css/home.css">
</head>
<body>
  <main class="desktop">
    <section class="window">
      <header class="titlebar"><span>🎮 Windows Classic Games</span><span>— □ ×</span></header>
      <nav class="menubar"><span>文件</span><span>游戏</span><span>帮助</span></nav>
      <div class="content">
        <h1>经典游戏</h1>
        <p class="subtitle">Windows XP 风格网页版小游戏</p>
        <!-- 游戏卡片由 js/games-data.js + js/home.js 自动生成，这里不放硬编码 -->
        <div class="games" id="game-list"></div>
      </div>
      <footer><span>就绪</span><span id="game-count">0 个可用游戏</span></footer>
    </section>
    <div class="taskbar">
      <button>🪟 开始</button>
      <span>🎮 Windows Classic Games</span>
      <time id="clock"></time>
    </div>
  </main>
  <!-- 先加载数据配置，再加载渲染逻辑 -->
  <script src="js/games-data.js"></script>
  <script src="js/home.js"></script>
</body>
</html>
